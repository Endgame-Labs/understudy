[package]
name = "understudy"
version = "0.1.0-preview.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/endgame-labs/understudy"
homepage = "https://github.com/endgame-labs/understudy"
description = "A drop-in, CPU-only proxy for System One decision models that learns per-question understudents from the lead's answers"

[lib]
path = "src/lib.rs"

[[bin]]
name = "understudy"
path = "src/main.rs"

[dependencies]
eg2cpu = { path = "vendor/eg2cpu" }
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
half = { version = "2", features = ["std"] }
rayon = "1.12.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a choice question's options are its criteria keys, in order (as Python dicts keep them).
# `float_roundtrip`: lead probabilities (and so weights and fits) parse exactly.
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
toml = { version = "0.8", default-features = false, features = ["parse"] }
url = "2"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }

[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"

# The profile that dist builds release artifacts with
[profile.dist]
inherits = "release"

[package.metadata.deb]
maintainer = "Endgame Labs, Inc."
copyright = "2026, Endgame Labs, Inc."
extended-description = """\
Understudy is a drop-in, CPU-only proxy for System One models. It forwards \
each request to the lead model and trains small CPU models, understudents, \
on the lead's answers. When an understudent reaches near-parity with the \
lead on a type of request, it graduates and Understudy answers that \
request locally. Graduated understudents are continuously audited against \
the lead and demoted if they slip."""
section = "utils"
priority = "optional"
depends = "$auto"
revision = ""
assets = [
    ["target/release/understudy", "usr/bin/understudy", "755"],
    ["README.md", "usr/share/doc/understudy/README.md", "644"],
    ["LICENSE", "usr/share/doc/understudy/LICENSE", "644"],
]
