name: docker

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the image from (for example v0.1.0-preview.1)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate the tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "invalid release tag: $TAG" >&2
            exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Verify the tag is the released commit
        run: |
          set -euo pipefail
          actual=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$(git rev-parse HEAD)" != "$actual" ]; then
            echo "checked-out commit does not match tag $TAG" >&2
            exit 1
          fi
          if [ -n "$RUN_SHA" ] && [ "$actual" != "$RUN_SHA" ]; then
            echo "tag $TAG is $actual but the Release run built $RUN_SHA" >&2
            exit 1
          fi

      - name: Download and extract the Linux archives
        run: |
          mkdir -p dl dist/amd64 dist/arm64
          for t in x86_64:amd64 aarch64:arm64; do
            triple="${t%%:*}"; arch="${t##*:}"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern "understudy-${triple}-unknown-linux-gnu.tar.xz" --dir dl
            tar -xJf "dl/understudy-${triple}-unknown-linux-gnu.tar.xz" -C dl
            bin=$(find "dl/understudy-${triple}-unknown-linux-gnu" -name understudy -type f | head -n1)
            install -m 0755 "$bin" "dist/${arch}/understudy"
          done

      - name: Determine the release kind
        id: kind
        run: |
          pre=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)
          echo "prerelease=$pre" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/endgame-labs/understudy
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.kind.outputs.version }}
            type=raw,value=preview,enable=${{ steps.kind.outputs.prerelease == 'true' }}
            type=raw,value=latest,enable=${{ steps.kind.outputs.prerelease != 'true' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
