name: deb

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload packages for (for example v0.1.0-preview.1)
        required: true

permissions:
  contents: write

jobs:
  deb:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    name: deb (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ github.event.workflow_run.head_branch || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      RUN_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Validate the tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "invalid release tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Verify the tag is the released commit
        run: |
          set -euo pipefail
          actual=$(git rev-parse "refs/tags/$TAG^{commit}")
          if [ "$(git rev-parse HEAD)" != "$actual" ]; then
            echo "checked-out commit does not match tag $TAG" >&2
            exit 1
          fi
          if [ -n "$RUN_SHA" ] && [ "$actual" != "$RUN_SHA" ]; then
            echo "tag $TAG is $actual but the Release run built $RUN_SHA" >&2
            exit 1
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      - name: Build package
        run: cargo deb

      - name: Upload to release
        run: |
          shopt -s nullglob
          files=(target/debian/understudy_*_"${{ matrix.arch }}".deb)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "expected exactly one .deb, found: ${files[*]}" >&2
            exit 1
          fi
          gh release upload "$TAG" "${files[0]}" --clobber --repo "$GITHUB_REPOSITORY"
